# 本机运行配置：独立练习库，密码由启动脚本临时提供。
server.address=127.0.0.1
server.port=8088
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/student_web_demo_20261010?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
spring.datasource.username=${DEMO_DB_USER:root}
spring.datasource.password=${DEMO_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:local-roles.sql
app.frontend-origin=http://127.0.0.1:5178
file.upload-dir=./profile-pictures
jwt.secret=${DEMO_JWT_SECRET}
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
